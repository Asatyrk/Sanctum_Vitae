<!DOCTYPE html>
<html>

<head>

<title>Characters</title>

<link rel="stylesheet" href="css/style.css">
<script defer src="js/characters.js"></script>

</head>

<body>

<h1>Characters</h1>

<div class="list-controls">
  <div class="list-search">
    <label for="search-input">Search:</label>
    <input id="search-input" type="search" placeholder="Search characters…" />
  </div>

  <div class="list-sort">
    <label for="sort-select">Sort:</label>
    <select id="sort-select">
      <option value="name-asc" selected>Name A→Z</option>
      <option value="name-desc">Name Z→A</option>
    </select>
  </div>

  <button id="clear-filters" type="button">Clear filters</button>
</div>

<div class="match-mode">
  <label for="match-mode">Match mode:</label>
  <select id="match-mode">
    <option value="and" selected>All categories (AND)</option>
    <option value="or">Any category (OR)</option>
  </select>
</div>

<div id="tag-filters" class="tag-filters"></div>

<div id="character-grid" class="card-grid"></div>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Characters</title>
<link rel="icon" type="image/x-icon" href="assests/Logo/favicon.ico">

<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Castoro+Titling&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  
<script defer src="js/layout.js"></script>
<script defer src="js/page-title.js"></script>
<script defer src="js/characters.js"></script>

</head>

<body data-page="Characters" class="page-characters">

<div id="site-header"></div>

<div class="characters-layout">

<!-- LEFT SIDEBAR -->
<aside class="characters-sidebar">

<div class="sidebar-section">

    <label class="sidebar-label">Other Indexes</label>

    <!-- Code these buttons later to go to the index rather than test profiles -->

    <button onclick="window.location.href='pet-profile.html?char=test_pet';" class="sidebar-button">View Pet Index</button>
    
    <button onclick="window.location.href='otherly-owned.html';" class="sidebar-button">View Otherly-Owned Index</button>

</div>

<div class="sidebar-section">

<label class="sidebar-label">Search</label>
<input id="search-input" type="search" placeholder="Search characters…" />

</div>

<div class="sidebar-section">

<label class="sidebar-label">Sort</label>

<select id="sort-select">
<option value="name-asc" selected>Name A→Z</option>
<option value="name-desc">Name Z→A</option>
</select>

</div>

<div class="sidebar-section">

<label class="sidebar-label">Match Mode</label>

<select id="match-mode">
<option value="and" selected>All selected tags</option>
<option value="or">Any selected tag</option>
</select>

</div>

<button id="clear-filters" class="sidebar-button">Clear Filters</button>

<div id="tag-filters" class="tag-filters"></div>

</aside>

<!-- CORKBOARD GRID -->
<main class="characters-board">

<div id="character-grid"></div>

</main>

</div>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Faction</title>
<link rel="icon" type="image/x-icon" href="assets/logos/favicon.ico">

<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Castoro+Titling&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">

<script defer src="js/layout.js"></script>
<script defer src="js/faction-profile-loader.js"></script>

</head>

<body data-page="faction" class="character-profile-page faction-profile-page">

<div id="faction-background" class="faction-background" aria-hidden="true"></div>

<div id="site-header"></div>

<div class="page-container">

<div class="profile-navigation">

  <a href="factions.html">
    <span>← Back to Factions</span>
  </a>

  <span id="faction-navigation"></span>

</div>

<!-- PROFILE CARD -->
<div class="character-profile-card">
  
  <!-- Left Column: Avatar & Basic Info -->
  <div class="faction-profile-card-left ">
    <div class="profile-avatar" id="avatar-image"></div>
    <h1 id="name" class="profile-name"></h1>
    
    <div class="profile-info-section">
      <div class="info-row">
        <span class="info-label">PARENT FACTION(s)</span>
        <span class="info-value" id="parent_faction(s)"></span>
      </div>
      <hr class="info-divider">
      
      <div class="info-row">
        <span class="info-label">TYPE</span>
        <span class="info-value" id="type"></span>
      </div>
    </div>
  </div>

  <!-- Right Column: Full Body Image & Details -->
  <div class="faction-profile-card-right">
    <div class="faction-profile-description" id="description"></div>
  </div>
  
</div>
<!-- END PROFILE CARD -->

<!-- CHARACTERS BOX -->
<div id="relationships-section" class="relationships-section" hidden>

  <div class="relationships-header">
    <h2>Members</h2>
  </div>

  <div id="relationships-container" class="relationships-container"></div>

  <template id="relationship-template">

    <div class="relationship-card">

      <a class="relationship-avatar-link" target="_self">
        <div class="relationship-avatar"></div>
      </a>

      <h2 class="relationship-name"></h2>

      <p class="relationship-type"></p><div class="profile-info-section">

      <div class="info-row">
        <span class="info-label">AGE</span>
        <span class="info-value relationship-age"></span>
      </div>
      <hr class="info-divider">
      
      <div class="info-row">
        <span class="info-label">PRONOUNS</span>
        <span class="info-value relationship-pronouns"></span>
      </div>
      <hr class="info-divider">
      
      <div class="info-row">
        <span class="info-label">SPECIES</span>
        <span class="info-value relationship-species"></span>
      </div>
    </div>

    </div>

  </template>

</div>
<!-- END CHARACTERS BOX -->

</div>

</body>

</html>

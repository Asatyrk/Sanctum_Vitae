<!-- CHARACTER PROFILE CARD -->
<div class="character-profile-card">
  
  <!-- Left Column: Avatar & Basic Info -->
  <div class="profile-card-left">
    <div class="profile-avatar" id="avatar-image"></div>
    <h1 id="name" class="profile-name"></h1>
    
    <div class="profile-info-section">
      <div class="info-row">
        <span class="info-label">AGE</span>
        <span class="info-value" id="age"></span>
      </div>
      <hr class="info-divider">
      
      <div class="info-row">
        <span class="info-label">SPECIES</span>
        <span class="info-value" id="species"></span>
      </div>
      <hr class="info-divider">
      
      <div class="info-row">
        <span class="info-label">GENDER</span>
        <span class="info-value" id="gender_identity"></span>
      </div>
      <hr class="info-divider">
      
      <div class="info-row">
        <span class="info-label">PRONOUNS</span>
        <span class="info-value" id="pronouns"></span>
      </div>
      <hr class="info-divider">
      
      <div class="info-row">
        <span class="info-label">ELEMENTS</span>
        <span class="info-value" id="elements"></span>
      </div>
    
    </div>
  </div>

  <!-- Right Column: Full Body Image & Details -->
  <div class="profile-card-right">
    <div class="profile-banner" id="banner-image"></div>
    
    <div class="profile-content">
      <div class="info-row">
        <span class="info-label">ALIASES</span>
        <span class="info-value" id="aliases"></span>
      </div>
      <hr class="info-divider">
      
      <div class="info-row">
        <span class="info-label">OCCUPATION</span>
        <span class="info-value" id="occupation"></span>
      </div>
      <hr class="info-divider">
      
      <ul class="profile-traits" id="profile-notes"></ul>
    </div>
  </div>
  
</div>
<!-- END CHARACTER PROFILE CARD -->

<!-- DESIGN DETAIL BOX -->
<div class="design-details-layout-pet">

  <div class="design-details-left">

    <div class="character-detail-card design-info-box">

      <div class="detail-split-left">

        <div class="info-row">
          <span class="info-label">SIZE</span>
          <span class="info-value" id="size"></span>
        </div>

        <hr class="info-divider">

        <div class="info-row">
          <span class="info-label">BUILD</span>
          <span class="info-value" id="build"></span>
        </div>

        <hr class="info-divider">

        <div class="info-row">
          <span class="info-label">EYES</span>
          <span class="info-value" id="eye_colour"></span>
        </div>

        <hr class="info-divider">

        <div class="info-row">
          <span class="info-label">COLOUR</span>
          <span class="info-value" id="body_colour"></span>
        </div>

      </div>

    </div>


    <div class="character-detail-card design-notes-box">

      <div class="detail-banner-header">
        <h2>Design Notes</h2>
      </div>

      <div class="detail-banner-content">

        <ul class="profile-traits" id="design-notes"></ul>

      </div>

    </div>

  </div>


  <div class="design-image-box-pet" id="design-image">

  </div>

</div>
<!-- END DESIGN DETAIL BOX -->

<!-- PARTNERS BOX -->
<div id="partners-section" class="partners-section" hidden>

  <div id="partners-container"></div>

  <template id="partner-template">

  <div class="character-profile-card partner-card">

    <!-- Left Column: Relationship Information -->
    <div class="profile-card-right">

      <div class="profile-content">

          <h2>OWNER</h2>

        <ul class="profile-traits partner-notes"></ul>

      </div>

    </div>


    <!-- Right Column: Partner Information -->
    <div class="profile-card-left">

      <a class="partner-avatar-link" target="_self">
        <div class="profile-avatar partner-avatar"></div>
      </a>

      <h2 class="profile-name partner-name"></h2>

      <div class="profile-info-section">

        <div class="info-row">
          <span class="info-label">AGE</span>
          <span class="info-value partner-age"></span>
        </div>

        <hr class="info-divider">

        <div class="info-row">
          <span class="info-label">SPECIES</span>
          <span class="info-value partner-species"></span>
        </div>

        <hr class="info-divider">

        <div class="info-row">
          <span class="info-label">GENDER</span>
          <span class="info-value partner-gender"></span>
        </div>

        <hr class="info-divider">

        <div class="info-row">
          <span class="info-label">PRONOUNS</span>
          <span class="info-value partner-pronouns"></span>
        </div>

      </div>

    </div>

  </div>

</template>

</div>
<!-- END PARTNERS BOX -->

<!-- RELATIONSHIPS BOX -->
<div id="relationships-section" class="relationships-section" hidden>

  <div class="relationships-header">
    <h2>Relationships</h2>
  </div>

  <div id="relationships-container" class="relationships-container"></div>

  <template id="relationship-template">

    <div class="relationship-card">

      <a class="relationship-avatar-link" target="_self">
        <div class="relationship-avatar"></div>
      </a>

      <h2 class="relationship-name"></h2>

      <p class="relationship-type"></p>

    </div>

  </template>

</div>
<!-- END RELATIONSHIPS BOX -->

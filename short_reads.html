<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Short Reads</title>
<link rel="icon" type="image/x-icon" href="assets/logos/favicon.ico">

<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Castoro+Titling&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  
<script defer src="js/layout.js"></script>
<script defer src="js/breadcrumb.js"></script>
<script defer src="js/page-title.js"></script>
<script defer src="js/short_reads.js"></script>

</head>

<body data-page="Short Reads" class="page-short-reads">

<div id="site-header"></div>

<div class="breadcrumb-container" aria-label="Breadcrumb"></div>

<div class="characters-layout">

<!-- LEFT SIDEBAR -->
<aside class="characters-sidebar">

<div class="sidebar-section">
    <label class="sidebar-label">Welcome to the Short Reads Index. This contains smaller, self-contained stories set within the SV universe. Usually smaller writing projects or one-shot reads containing one or a few characters.</label> 
</div>

<div class="sidebar-section">

    <label class="sidebar-label">Other Indexes</label>

    <button onclick="window.location.href='stories.html';" class="sidebar-button">View Stories</button>

</div>

<div class="sidebar-section">

<label class="sidebar-label">Search</label>
<input id="search-input" type="search" placeholder="Search short reads…" />

</div>

<div class="sidebar-section">

<label class="sidebar-label">Sort</label>

<select id="sort-select">
<option value="name-asc" selected>Name A→Z</option>
<option value="name-desc">Name Z→A</option>
</select>

</div>

<div class="sidebar-section">

<label class="sidebar-label">Match Mode</label>

<select id="match-mode">
<option value="and" selected>All selected tags</option>
<option value="or">Any selected tag</option>
</select>

</div>

<button id="clear-filters" class="sidebar-button">Clear Filters</button>

<div id="tag-filters" class="tag-filters"></div>

</aside>

<main class="story-board">
    <div id="story-grid"></div>
</main>

</div>

<div id="site-footer"></div>

</body>

</html>

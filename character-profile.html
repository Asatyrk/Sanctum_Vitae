<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Character</title>

<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Castoro+Titling&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">

<script defer src="js/layout.js"></script>
<script defer src="js/page-title.js"></script>
<script defer src="js/character-profile-loader.js"></script>

</head>

<body data-page="name" class="character-profile-page">

<div id="site-header"></div>

<div class="page-container">

<a href="characters.html">← Back to Characters</a>

<!-- Character Profile Card -->
<div class="character-profile-card">
  
  <!-- Left Column: Avatar & Basic Info -->
  <div class="profile-card-left">
    <div class="profile-avatar" id="avatar-image"></div>
    <h1 id="name" class="profile-name"></h1>
    
    <div class="profile-info-section">
      <div class="info-row">
        <span class="info-label">AGE</span>
        <span class="info-value" id="age"></span>
      </div>
      <hr class="info-divider">
      
      <div class="info-row">
        <span class="info-label">SPECIES</span>
        <span class="info-value" id="species"></span>
      </div>
      <hr class="info-divider">
      
      <div class="info-row">
        <span class="info-label">GENDER</span>
        <span class="info-value" id="gender_identity"></span>
      </div>
      <hr class="info-divider">
      
      <div class="info-row">
        <span class="info-label">PRONOUNS</span>
        <span class="info-value" id="pronouns"></span>
      </div>
      <hr class="info-divider">
      
      <div class="info-row">
        <span class="info-label">ORIENTATION</span>
        <span class="info-value" id="orientation"></span>
      </div>
      <hr class="info-divider">
      
      <div class="info-row">
        <span class="info-label">ELEMENTS</span>
        <span class="info-value" id="elements"></span>
      </div>
      <hr class="info-divider">
      
      <div class="info-row">
        <span class="info-label">ETHNICITY</span>
        <span class="info-value" id="ethnicity"></span>
      </div>
    </div>
  </div>

  <!-- Right Column: Full Body Image & Details -->
  <div class="profile-card-right">
    <div class="profile-banner" id="banner-image"></div>
    
    <div class="profile-content">
      <div class="info-row">
        <span class="info-label">FULL NAME</span>
        <span class="info-value" id="full_name"></span>
      </div>
      <hr class="info-divider">
      
      <div class="info-row">
        <span class="info-label">ALIASES</span>
        <span class="info-value" id="aliases"></span>
      </div>
      <hr class="info-divider">
      
      <div class="info-row">
        <span class="info-label">OCCUPATION</span>
        <span class="info-value" id="occupation"></span>
      </div>
      <hr class="info-divider">
      
      <ul class="profile-traits" id="profile-notes"></ul>
    </div>
  </div>
  
</div>

<!-- =====================================================
     OTHER CHARACTER DETAILS
===================================================== -->

<!-- 50/50 DETAIL BOX -->
<div class="character-detail-card character-detail-split">

  <div class="detail-split-left">

    <div class="info-row">
      <span class="info-label">HEIGHT</span>
      <span class="info-value" id="height"></span>
    </div>

    <hr class="info-divider">

    <div class="info-row">
      <span class="info-label">BUILD</span>
      <span class="info-value" id="build"></span>
    </div>

    <hr class="info-divider">

    <div class="info-row">
      <span class="info-label">EYES</span>
      <span class="info-value" id="eye_colour"></span>
    </div>

    <hr class="info-divider">

    <div class="info-row">
      <span class="info-label">HAIR</span>
      <span class="info-value" id="hair_colour"></span>
    </div>

  </div>

  <div class="detail-split-right">

    <ul class="profile-traits" id="design-notes"></ul>

  </div>

</div>


<!-- BANNER DETAIL BOX -->
<div class="character-detail-card character-detail-banner">

  <div class="detail-banner-header">
    <h2>Personality</h2>
  </div>

  <div class="detail-banner-content">

    <p id="backstory"></p>

    <ul id="trivia"></ul>

  </div>

</div>

</div>

</body>

</html>

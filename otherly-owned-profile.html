<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Otherly-Owned Character</title>
<link rel="icon" type="image/x-icon" href="/assests/Logo/favicon.ico">

<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Castoro+Titling&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">

<script defer src="js/layout.js"></script>
<script defer src="js/character-profile-common.js"></script>
<script defer src="js/otherly-owned-profile-loader.js"></script>

</head>

<body data-page="name" class="character-profile-page">

<div id="character-background" class="character-background" aria-hidden="true">
  <div id="character-particles" class="character-particles"></div>
</div>

<div id="site-header"></div>

<div class="page-container">

<!-- Change to o-o-char index when added -->
<a href="characters.html">← Back to Characters</a>

<!-- CHARACTER PROFILE CARD -->
<div class="character-profile-card">
  
  <!-- Left Column: Avatar & Basic Info -->
  <div class="profile-card-left">
    <div class="profile-avatar" id="avatar-image"></div>
    <h1 id="name" class="profile-name"></h1>
    
    <div class="profile-info-section">
      <div class="info-row">
        <span class="info-label">AGE</span>
        <span class="info-value" id="age"></span>
      </div>
      <hr class="info-divider">
      
      <div class="info-row">
        <span class="info-label">SPECIES</span>
        <span class="info-value" id="species"></span>
      </div>
      <hr class="info-divider">
      
      <div class="info-row">
        <span class="info-label">GENDER</span>
        <span class="info-value" id="gender_identity"></span>
      </div>
      <hr class="info-divider">
      
      <div class="info-row">
        <span class="info-label">PRONOUNS</span>
        <span class="info-value" id="pronouns"></span>
      </div>
      <hr class="info-divider">
      
      <div class="info-row">
        <span class="info-label">ORIENTATION</span>
        <span class="info-value" id="orientation"></span>
      </div>
      <hr class="info-divider">
      
      <div class="info-row">
        <span class="info-label">ELEMENTS</span>
        <span class="info-value" id="elements"></span>
      </div>
      <hr class="info-divider">
      
      <div class="info-row">
        <span class="info-label">ETHNICITY</span>
        <span class="info-value" id="ethnicity"></span>
      </div>
    </div>
  </div>

  <!-- Right Column: Full Body Image & Details -->
  <div class="profile-card-right">
    <div class="profile-banner" id="banner-image"></div>
    
    <div class="profile-content">
      <div class="info-row">
        <span class="info-label">FULL NAME</span>
        <span class="info-value" id="full_name"></span>
      </div>
      <hr class="info-divider">
      
      <div class="info-row">
        <span class="info-label">ALIASES</span>
        <span class="info-value" id="aliases"></span>
      </div>
      <hr class="info-divider">
      
      <div class="info-row">
        <span class="info-label">OCCUPATION</span>
        <span class="info-value" id="occupation"></span>
      </div>
      <hr class="info-divider">
      
      <ul class="profile-traits" id="profile-notes"></ul>
    </div>
  </div>
  
</div>
<!-- END CHARACTER PROFILE CARD -->

<!-- PARTNERS BOX -->
<div id="partners-section" class="partners-section" hidden>

  <div id="partners-container"></div>

  <template id="partner-template">

  <div class="character-profile-card partner-card">

    <!-- Left Column: Relationship Information -->
    <div class="profile-card-right">

      <div class="profile-content">

          <h2>PARTNER</h2>

        <div class="info-row">
          <span class="info-label">RELATIONSHIP</span>
          <span class="info-value partner-relationship"></span>
        </div>

        <hr class="info-divider">

        <div class="info-row">
          <span class="info-label">STATUS</span>
          <span class="info-value partner-status"></span>
        </div>

        <hr class="info-divider">

        <div class="info-row">
          <span class="info-label">DYNAMIC</span>
          <span class="info-value partner-dynamic"></span>
        </div>

        <hr class="info-divider">

        <div class="info-row">
          <span class="info-label">SINCE</span>
          <span class="info-value partner-since"></span>
        </div>

        <ul class="profile-traits partner-notes"></ul>

      </div>

    </div>


    <!-- Right Column: Partner Information -->
    <div class="profile-card-left">

      <a class="partner-avatar-link" target="_self">
        <div class="profile-avatar partner-avatar"></div>
      </a>

      <h2 class="profile-name partner-name"></h2>

      <div class="profile-info-section">

        <div class="info-row">
          <span class="info-label">AGE</span>
          <span class="info-value partner-age"></span>
        </div>

        <hr class="info-divider">

        <div class="info-row">
          <span class="info-label">SPECIES</span>
          <span class="info-value partner-species"></span>
        </div>

        <hr class="info-divider">

        <div class="info-row">
          <span class="info-label">GENDER</span>
          <span class="info-value partner-gender"></span>
        </div>

        <hr class="info-divider">

        <div class="info-row">
          <span class="info-label">PRONOUNS</span>
          <span class="info-value partner-pronouns"></span>
        </div>

      </div>

    </div>

  </div>

</template>

</div>
<!-- END PARTNERS BOX -->

<!-- RELATIONSHIPS BOX -->
<div id="relationships-section" class="relationships-section" hidden>

  <div class="relationships-header">
    <h2>Relationships</h2>
  </div>

  <div id="relationships-container" class="relationships-container"></div>

  <template id="relationship-template">

    <div class="relationship-card">

      <a class="relationship-avatar-link" target="_self">
        <div class="relationship-avatar"></div>
      </a>

      <h2 class="relationship-name"></h2>

      <p class="relationship-type"></p>

    </div>

  </template>

</div>
<!-- END RELATIONSHIPS BOX -->

<!-- PETS BOX --> 
 <div id="pets-section" class="pets-section" hidden> 
  <div id="pets-container"></div> 
  <template id="pet-template">
  <div class="pet-layout">

    <!-- Pet Information -->
    <div class="character-profile-card pet-card">

      <div class="profile-card-left">

        <a class="pet-avatar-link" target="_self">
          <div class="profile-avatar pet-avatar"></div>
        </a>

        <h2 class="profile-name pet-name"></h2>

        <div class="profile-info-section">

          <div class="info-row">
            <span class="info-label">SPECIES</span>
            <span class="info-value pet-species"></span>
          </div>

          <hr class="info-divider">

          <div class="info-row">
            <span class="info-label">GENDER</span>
            <span class="info-value pet-gender"></span>
          </div>

        </div>

      </div>

      <div class="profile-card-right">

        <div class="profile-content">

          <h2>PET</h2>

          <ul class="profile-traits pet-notes"></ul>

        </div>

      </div>

    </div>

  <!-- Pet Fullbody -->
  <div class="pet-image-box">
    <a class="pet-image-link" target="_self">
      <div class="pet-fullbody"></div>
    </a>
  </div>

</div>

</template> 

</div> 
<!-- END PETS BOX -->

<!-- Add story box -->

</div>

</body>

</html>

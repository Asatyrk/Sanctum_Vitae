<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Stories</title>
<link rel="icon" type="image/x-icon" href="assets/logos/favicon.ico">

<link rel="stylesheet" href="css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Castoro+Titling&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">

<script defer src="js/layout.js"></script>
<script defer src="js/page-title.js"></script>
<script defer src="js/stories.js"></script>

</head>

<body data-page="Stories" class="page-stories">

<div id="site-header"></div>

<div class="stories-layout">

  <!-- LEFT SIDEBAR -->
  <aside class="stories-sidebar">

    <div class="sidebar-section">
      <label class="sidebar-label">Info text.</label>
    </div>

    <div class="sidebar-section">

      <label class="sidebar-label">Search</label>

      <input
        id="story-search-input"
        type="search"
        placeholder="Search stories…"
      />

    </div>

    <div class="sidebar-section">

      <label class="sidebar-label">Sort</label>

      <select id="story-sort-select">
        <option value="name-asc" selected>Name A→Z</option>
        <option value="name-desc">Name Z→A</option>
      </select>

    </div>

    <div class="sidebar-section">

      <label class="sidebar-label">Match Mode</label>

      <select id="story-match-mode">
        <option value="and" selected>All selected tags</option>
        <option value="or">Any selected tag</option>
      </select>

    </div>

    <button
      id="story-clear-filters"
      class="sidebar-button"
    >
      Clear Filters
    </button>

    <div
      id="story-tag-filters"
      class="tag-filters"
    ></div>

  </aside>


  <!-- STORY GRID -->
  <main class="stories-board">

    <div id="story-grid"></div>

  </main>

</div>

</body>

</html>

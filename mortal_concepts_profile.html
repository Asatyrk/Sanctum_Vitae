<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Mortal Concepts</title>
<link rel="icon" type="image/x-icon" href="assets/logos/favicon.ico">

<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Castoro+Titling&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">

<script defer src="js/layout.js"></script>
<script defer src="js/breadcrumb.js"></script>
<script defer src="js/page-title.js"></script>
<script defer src="js/mortal_concepts_profile_loader.js"></script>

</head>

<body data-page="species">

<div id="site-header"></div>

<div class="breadcrumb-container" aria-label="Breadcrumb"></div>

<div class="page-container">

    <h2 id="concept-name" class="box__title_large"></h2>
    <h2 id="aka-names" class="box__title"></h2>
    <h2 id="latin-name" class="box__title_small"><i></i></h2>

    <p id="description" class="box__text"></p>

    <hr class="line_thin">


<!-- Image + Quick facts -->
<div id="quick-facts-section" class="box box--image-left">

  <img id="concept-image" class="box__image" src="" alt="">

  <div class="box__content">

          <div class="info-row">
            <span class="info-label">
              <strong>Family</strong>
            </span>

            <span id="quick-family" class="info-value"></span>
          </div>

        <hr class="line_thin">

          <div class="info-row">
            <span class="info-label">
              <strong>Rarity</strong>
            </span>

            <span id="quick-rarity" class="info-value"></span>
          </div>

        <hr class="line_thin">

          <div class="info-row">
            <span class="info-label">
              <strong>Origin</strong>
            </span>

            <span id="quick-origin" class="info-value"></span>
          </div>

        <hr class="line_thin">

          <div class="info-row">
            <span class="info-label">
              <strong>Range/Habitat</strong>
            </span>

            <span id="quick-range" class="info-value"></span>
          </div>

        <hr class="line_thin">

          <div class="info-row">
            <span class="info-label">
              <strong>Lifespan</strong>
            </span>

            <span id="quick-lifespan" class="info-value"></span>
          </div>

        <hr class="line_thin">

          <div class="info-row">
            <span class="info-label">
              <strong>Height/Build</strong>
            </span>

            <span id="quick-height" class="info-value"></span>
          </div>

        <hr class="line_thin">

          <div class="info-row">
            <span class="info-label">
              <strong>Gender Ratio</strong>
            </span>

            <span id="quick-gender" class="info-value"></span>
          </div>

        <hr class="line_thin">

          <div class="info-row">
            <span class="info-label">
              <strong>Diet</strong>
            </span>

            <span id="quick-diet" class="info-value"></span>
          </div>

        <hr class="line_thin">

          <div class="info-row">
            <span class="info-label">
              <strong>Native Languages</strong>
            </span>

            <span id="quick-languages" class="info-value"></span>
          </div>

  </div>
</div>


<!-- Behaviour -->
<div id="behaviour-section" class="text-box">

  <h2 class="box__title">Behaviour</h2>
  
  <h2 class="box__title_small">Disposition</h2>
  <p id="behaviour-disposition" class="text-box__text"></p>
  
  <h2 class="box__title_small">Social Structure</h2>
  <p id="behaviour-social-structure" class="text-box__text"></p>
  
  <h2 class="box__title_small">Communication</h2>
  <p id="behaviour-communication" class="text-box__text"></p>

</div>


<!-- Abilities -->
<div id="abilities-section" class="text-box">

  <h2 class="box__title">Abilities</h2>
  
  <h2 class="box__title_small">Strengths</h2>
  <p id="abilities-strengths" class="text-box__text"></p>
  
  <h2 class="box__title_small">Weaknesses</h2>
  <p id="abilities-weaknesses" class="text-box__text"></p>
  
  <h2 class="box__title_small">Notable Skills</h2>
  <p id="abilities-notable-skills" class="text-box__text"></p>

</div>


<!-- Field Notes -->
<div id="field-notes-section" class="text-box">

  <h2 class="box__title">Field Notes</h2>
  
  <h2 class="box__title_small">Danger Level</h2>
  <p id="field-danger-level" class="text-box__text"></p>
  
  <h2 class="box__title_small">Signs Of Presence</h2>
  <p id="field-signs-of-presence" class="text-box__text"></p>
  
  <h2 class="box__title_small">Approach Advice</h2>
  <p id="field-approach-advice" class="text-box__text"></p>

</div>


<!-- Extra Information -->
<div id="extra-information-section" class="text-box">

  <h2 class="box__title">Extra Information</h2>
  <div id="extra-information"></div>

</div>


<!-- Subspecies (optional) -->
<div id="subspecies-section" class="text-box">

  <h2 class="box__title">Subspecies</h2>
  <div id="subspecies-container"></div>

</div>


</div>

<div id="site-footer"></div>

</body>

</html>

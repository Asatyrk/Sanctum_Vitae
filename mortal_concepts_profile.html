<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Mortal Concepts</title>
<link rel="icon" type="image/x-icon" href="assets/logos/favicon.ico">

<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Castoro+Titling&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">

<script defer src="js/layout.js"></script>
<script defer src="js/breadcrumb.js"></script>
<script defer src="js/page-title.js"></script>
<script defer src="js/mortal_concepts_profile_loader.js"></script>

</head>

<body data-page="species">

<div id="site-header"></div>

<div class="breadcrumb-container" aria-label="Breadcrumb"></div>

<div class="page-container">

<!-- Image left, text right -->
<div class="box box--image-left">
  <img class="box__image" src="https://placehold.co/400" alt="Description">

  <div class="box__content">
    <h3 class="box__title">Species name</h3>
    <h2 class="box__title">Latin names</h2>

          <div class="info-row">
            <span class="info-label">
              <strong>Family</strong>
            </span>

            <span class="info-value"></span>
          </div>

          <div class="info-row">
            <span class="info-label">
              <strong>Rarity</strong>
            </span>

            <span class="info-value"></span>
          </div>

          <div class="info-row">
            <span class="info-label">
              <strong>Origin</strong>
            </span>

            <span class="info-value"></span>
          </div>

          <div class="info-row">
            <span class="info-label">
              <strong>Range/Habitat</strong>
            </span>

            <span class="info-value"></span>
          </div>

          <div class="info-row">
            <span class="info-label">
              <strong>Lifespan</strong>
            </span>

            <span class="info-value"></span>
          </div>

          <div class="info-row">
            <span class="info-label">
              <strong>Height/Build</strong>
            </span>

            <span class="info-value"></span>
          </div>

          <div class="info-row">
            <span class="info-label">
              <strong>Gender Ratio</strong>
            </span>

            <span class="info-value"></span>
          </div>

          <div class="info-row">
            <span class="info-label">
              <strong>Diet</strong>
            </span>

            <span class="info-value"></span>
          </div>

          <div class="info-row">
            <span class="info-label">
              <strong>Native Languages</strong>
            </span>

            <span class="info-value"></span>
          </div>

    <p class="box__text">
      Descripton goes here
    </p>
  </div>
</div>

</div>

<div id="site-footer"></div>

</body>

</html>

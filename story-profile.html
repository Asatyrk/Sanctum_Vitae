<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Story</title>
<link rel="icon" type="image/x-icon" href="assets/logos/favicon.ico">

<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Castoro+Titling&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">

<script defer src="js/layout.js"></script>
<script defer src="js/story-profile-loader.js"></script>

</head>

<body data-page="story" class="story-profile-page">

<div id="story-background" class="story-background" aria-hidden="true"></div>

<div id="site-header"></div>

<div class="page-container">

<div class="profile-navigation">

  <a href="stories.html">
    <span>← Back to Stories</span>
  </a>

  <span id="story-navigation"></span>

</div>

<!-- STORY PROFILE CARD -->
<div class="story-profile-card">

  <!-- Left Column: Avatar & Basic Info -->
  <div class="story-profile-card-left">

    <div class="story-profile-avatar" id="avatar-image"></div>

    <h1 id="name" class="story-profile-name"></h1>

    <p class="story-page-tagline" hidden></p>

    <div class="story-profile-info-section">

      <div class="story-info-row">
        <span class="story-info-label">GENRE</span>
        <span class="story-info-value" id="genre"></span>
      </div>

      <hr class="story-info-divider">

      <div class="story-info-row">
        <span class="story-info-label">AGE RANGE</span>
        <span class="story-info-value" id="age-range"></span>
      </div>

      <hr class="story-info-divider">

      <div class="story-info-row">
        <span class="story-info-label">STATUS</span>
        <span class="story-info-value" id="status"></span>
      </div>

      <hr class="story-info-divider">

      <div class="story-info-row">
        <span class="story-info-label">STORY TYPE</span>
        <span class="story-info-value" id="story-type"></span>
      </div>

    </div>

  </div>

  <!-- Right Column: Banner & Description -->
  <div class="story-profile-card-right">

    <div
      class="story-profile-banner"
      id="banner-image"
    ></div>

    <div
      class="story-profile-content"
      id="description"
    ></div>

  </div>

</div>
<!-- END STORY PROFILE CARD -->


<!-- CHARACTERS BOX -->
<div
  id="relationships-section"
  class="story-relationships-section"
  hidden
>

  <div class="story-relationships-header">
    <h2>Characters</h2>
  </div>

  <div
    id="relationships-container"
    class="story-relationships-container"
  ></div>

  <template id="relationship-template">

    <div class="story-relationship-card">

      <a
        class="story-relationship-avatar-link"
        target="_self"
      >
        <div class="story-relationship-avatar"></div>
      </a>

      <h2 class="story-relationship-name"></h2>

      <p class="story-relationship-type"></p>

    </div>

  </template>

</div>
<!-- END CHARACTERS BOX -->


<!-- DECOR IMAGE BOX -->
<div
  class="story-decor-image-box"
  id="decor-image"
></div>
<!-- END DECOR IMAGE BOX -->


<!-- STORY BOX -->
<div class="story-detail-card story-detail-banner">

  <div class="story-detail-banner-header">
    <h2></h2>
  </div>

  <div class="story-detail-banner-content">

    <div id="backstory"></div>

  </div>

</div>
<!-- END STORY BOX -->


</div>

</body>

</html>
